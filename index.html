<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>珍奶打地鼠</title>
<style>
:root{--bg:#fff4e0;--card:#ffffff;--ink:#3b2a1a;--sub:#8a6f55;--hole:#e8d2b0;--acc:#e8743b;--bad:#d93a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1710;--card:#2c2118;--ink:#fbeedd;--sub:#c4a888;--hole:#12090299;--acc:#ff9156;--bad:#ff6b6b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1710;--card:#2c2118;--ink:#fbeedd;--sub:#c4a888;--hole:#12090299;--acc:#ff9156;--bad:#ff6b6b;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:flex;justify-content:center;min-height:100vh}
main{width:100%;max-width:440px;padding:20px 16px;text-align:center}
h1{margin:6px 0 2px;font-size:28px}
.sub{color:var(--sub);font-size:14px;margin:0 0 14px}
.bar{display:flex;gap:8px;justify-content:center;margin-bottom:14px}
.stat{flex:1;background:var(--card);border-radius:14px;padding:8px 4px;box-shadow:0 2px 6px #0002}
.stat b{display:block;font-size:24px;color:var(--acc)}
.stat span{font-size:12px;color:var(--sub)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:var(--card);padding:14px;border-radius:20px;box-shadow:0 4px 12px #0002;touch-action:manipulation}
.hole{aspect-ratio:1;border-radius:50%;background:var(--hole);position:relative;overflow:hidden;cursor:pointer;user-select:none}
.item{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,14vw,64px);transform:translateY(110%);transition:transform .12s}
.hole.up .item{transform:translateY(0)}
.hole.hit .item{transform:translateY(0) scale(1.3);opacity:.3;transition:all .15s}
.pop{position:absolute;left:50%;top:30%;font-weight:700;font-size:26px;pointer-events:none;animation:fly .6s forwards}
@keyframes fly{to{transform:translate(-50%,-40px);opacity:0}}
.pop{transform:translateX(-50%)}
button{margin-top:16px;font:inherit;font-size:18px;font-weight:700;padding:12px 32px;border:0;border-radius:999px;background:var(--acc);color:#fff;cursor:pointer}
button:active{transform:scale(.96)}
.rule{font-size:13px;color:var(--sub);margin-top:14px;line-height:1.7}
#msg{min-height:26px;margin-top:12px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>🧋 珍奶打地鼠</h1>
<p class="sub">30 秒內，盡可能多敲到珍奶！</p>
<div class="bar">
<div class="stat"><b id="score">0</b><span>分數</span></div>
<div class="stat"><b id="time">30</b><span>秒</span></div>
<div class="stat"><b id="best">0</b><span>最高分</span></div>
</div>
<div id="grid"></div>
<div id="msg"></div>
<button id="start">開始遊戲</button>
<div class="rule">🧋 +1　🌟 +3　🍰 +2　💣 −3（別敲！）<br>越到後面出現得越快，加油！</div>
</main>
<script>
const items=[{e:"🧋",p:1,w:60},{e:"🍰",p:2,w:15},{e:"🌟",p:3,w:10},{e:"💣",p:-3,w:15}];
const grid=document.getElementById("grid"),$=id=>document.getElementById(id);
let holes=[],score=0,left=30,running=false,best=0,tSpawn,tClock;
try{best=+localStorage.getItem("wb")||0}catch(e){}
$("best").textContent=best;
for(let i=0;i<9;i++){
  const h=document.createElement("div");h.className="hole";
  h.innerHTML='<div class="item"></div>';
  h.addEventListener("pointerdown",()=>whack(i));
  grid.appendChild(h);holes.push({el:h,it:null,t:null});
}
function pick(){let r=Math.random()*100;for(const i of items){if((r-=i.w)<0)return i}return items[0]}
function spawn(){
  if(!running)return;
  const free=holes.filter(h=>!h.it);
  if(free.length){
    const h=free[Math.floor(Math.random()*free.length)],it=pick();
    h.it=it;h.el.firstChild.textContent=it.e;h.el.classList.remove("hit");h.el.classList.add("up");
    const stay=Math.max(500,1000-(30-left)*15);
    h.t=setTimeout(()=>hide(h),stay);
  }
  tSpawn=setTimeout(spawn,Math.max(280,750-(30-left)*14));
}
function hide(h){clearTimeout(h.t);h.it=null;h.el.classList.remove("up","hit")}
function whack(i){
  const h=holes[i];if(!running||!h.it)return;
  const p=h.it.p;score=Math.max(0,score+p);$("score").textContent=score;
  const pop=document.createElement("div");pop.className="pop";
  pop.textContent=(p>0?"+":"")+p;pop.style.color=p>0?"var(--acc)":"var(--bad)";
  h.el.appendChild(pop);setTimeout(()=>pop.remove(),600);
  clearTimeout(h.t);h.it=null;h.el.classList.add("hit");
  setTimeout(()=>h.el.classList.remove("up","hit"),150);
}
function end(){
  running=false;clearTimeout(tSpawn);clearInterval(tClock);holes.forEach(hide);
  let m="時間到！你得了 "+score+" 分 ";
  if(score>best){best=score;$("best").textContent=best;m+="🎉 新紀錄！";try{localStorage.setItem("wb",best)}catch(e){}}
  else m+=score>=25?"🔥 太強了":score>=12?"👍 不錯喔":"💪 再試一次";
  $("msg").textContent=m;$("start").textContent="再玩一次";$("start").disabled=false;
}
$("start").onclick=()=>{
  score=0;left=30;running=true;$("score").textContent=0;$("time").textContent=30;
  $("msg").textContent="";$("start").disabled=true;$("start").textContent="進行中…";
  tClock=setInterval(()=>{$("time").textContent=--left;if(left<=0)end()},1000);
  spawn();
};
</script>
</body>
</html>
